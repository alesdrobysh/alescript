<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alescript Playground</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/editor/editor.main.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e1e1e;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #d4d4d4;
        }

        header {
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #cccccc;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 1.5rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #858585;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .controls label {
            font-size: 0.85rem;
            color: #cccccc;
        }

        .controls select {
            padding: 6px 10px;
            border: 1px solid #3e3e42;
            border-radius: 3px;
            background: #3c3c3c;
            color: #cccccc;
            font-size: 13px;
            cursor: pointer;
            min-width: 200px;
            outline: none;
        }

        .controls select:hover {
            background: #4e4e4e;
        }

        .controls select:focus {
            border-color: #007acc;
        }

        .controls button {
            padding: 6px 16px;
            border: none;
            border-radius: 3px;
            background: #0e639c;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls button:hover {
            background: #1177bb;
        }

        .controls button:active {
            background: #0d5a8f;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3e3e42;
        }

        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            background: #2d2d30;
            color: #cccccc;
            padding: 8px 15px;
            font-size: 0.85rem;
            font-weight: 500;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #editor-container {
            flex: 1;
            overflow: hidden;
        }

        #output {
            flex: 1;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #1e1e1e;
            color: #d4d4d4;
        }

        #output::-webkit-scrollbar {
            width: 10px;
        }

        #output::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        #output::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 5px;
        }

        #output::-webkit-scrollbar-thumb:hover {
            background: #4e4e4e;
        }

        .loading {
            color: #4fc3f7;
            font-style: italic;
        }

        .error {
            color: #f48771;
        }

        .success {
            color: #89d185;
        }

        .status-bar {
            background: #007acc;
            color: white;
            padding: 4px 15px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h1><span class="logo">🍺</span> Alescript Playground</h1>
            <span class="subtitle">A brewing-themed programming language</span>
        </div>
        <div class="controls">
            <label for="examples">Examples:</label>
            <select id="examples">
                <option value="">-- Select an example --</option>
                <option value="hello">Hello World</option>
                <option value="fibonacci">Fibonacci Sequence</option>
                <option value="brewing">Brewing Demo</option>
            </select>
            <button id="runButton">▶ Run</button>
        </div>
    </header>

    <div class="container">
        <div class="panel">
            <div class="panel-header">📝 Code Editor</div>
            <div id="editor-container"></div>
        </div>

        <div class="panel">
            <div class="panel-header">📤 Output</div>
            <div id="output">Click "Run" to execute your code...</div>
        </div>
    </div>

    <div class="status-bar">
        <span id="status">⏳ Loading...</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script type="module">
        // Examples database
        const examples = {
            hello: `// Hello World in alescript
toast "hello, world!".`,

            fibonacci: `// Fibonacci sequence in alescript

recipe fibonacci(n)
    brew a from water.
    brew b from water, barley.
    wait for 1 day.
    brew temp from water.

    repeat n times:
        relabel temp as a.
        relabel a as b.
        blend b with temp.
    end.

    a
end.

toast fibonacci(10).`,

            brewing: `// Example brewing program

// Create a lager with specific ingredients
brew lager from water, 1 barley, 2 hops, 1 yeast.

// Create a stout with different ingredients
brew stout from water, 2 barley, 1 hops, 1 yeast.

// Wait for fermentation
wait for 2 days.

// Check the results
taste lager.
taste stout.

// Age the lager to perfection
age lager until 10%.

// Keg it to stop growth
keg lager.

// Wait more - lager should stay at 10%, stout will continue growing
wait for 2 days.

// Blend brews together
blend lager with stout.

// Judge the strength
judge if lager is stronger than 5.0%:
    toast "strong brew!".
else:
    toast "mild brew.".
end.

// Create a barrel of brews
barrel taplist = [lager, stout].

repeat each beer in taplist:
    taste beer.
end.`
        };

        // Monaco Editor instance
        let editor = null;
        let wasmModule = null;

        // Configure Monaco loader
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });

        // Initialize Monaco Editor with Alescript language
        require(['vs/editor/editor.main'], function() {
            // Register Alescript language
            monaco.languages.register({ id: 'alescript' });

            // Define Monarch syntax highlighting for Alescript
            monaco.languages.setMonarchTokensProvider('alescript', {
                keywords: [
                    'recipe', 'end', 'brew', 'from', 'wait', 'for', 'relabel', 'as',
                    'mix', 'with', 'repeat', 'times', 'each', 'in', 'toast', 'taste',
                    'age', 'until', 'keg', 'judge', 'if', 'is', 'than', 'else',
                    'barrel', 'stronger', 'weaker', 'day', 'days', 'water', 'barley',
                    'hops', 'yeast'
                ],

                operators: [
                    '=', '>', '<', '+', '-', '*', '/'
                ],

                symbols: /[=><!~?:&|+\-*\/\^%]+/,

                tokenizer: {
                    root: [
                        // Keywords
                        [/[a-z_$][\w$]*/, {
                            cases: {
                                '@keywords': 'keyword',
                                '@default': 'identifier'
                            }
                        }],

                        // Whitespace
                        { include: '@whitespace' },

                        // Numbers
                        [/\d*\.\d+([eE][\-+]?\d+)?/, 'number.float'],
                        [/\d+/, 'number'],

                        // Strings
                        [/"([^"\\]|\\.)*$/, 'string.invalid'],
                        [/"/, 'string', '@string'],

                        // Delimiters and operators
                        [/[{}()\[\]]/, '@brackets'],
                        [/[<>](?!@symbols)/, '@brackets'],
                        [/@symbols/, {
                            cases: {
                                '@operators': 'operator',
                                '@default': ''
                            }
                        }],

                        // Delimiter: .
                        [/[;,.]/, 'delimiter'],
                    ],

                    whitespace: [
                        [/[ \t\r\n]+/, 'white'],
                        [/\/\/.*$/, 'comment'],
                    ],

                    string: [
                        [/[^\\"]+/, 'string'],
                        [/\\./, 'string.escape'],
                        [/"/, 'string', '@pop']
                    ],
                }
            });

            // Define color theme for Alescript
            monaco.editor.defineTheme('alescript-dark', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: 'keyword', foreground: 'C586C0', fontStyle: 'bold' },
                    { token: 'identifier', foreground: '9CDCFE' },
                    { token: 'number', foreground: 'B5CEA8' },
                    { token: 'string', foreground: 'CE9178' },
                    { token: 'comment', foreground: '6A9955', fontStyle: 'italic' },
                    { token: 'operator', foreground: 'D4D4D4' },
                ],
                colors: {
                    'editor.background': '#1e1e1e',
                }
            });

            // Create Monaco Editor
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: examples.hello,
                language: 'alescript',
                theme: 'alescript-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: true },
                scrollBeyondLastLine: false,
                lineNumbers: 'on',
                renderWhitespace: 'selection',
                tabSize: 4,
                insertSpaces: true,
            });

            // Add keyboard shortcut for running code (Ctrl+Enter or Cmd+Enter)
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runCode);

            // Update status
            document.getElementById('status').innerHTML = '✓ Monaco Editor loaded';

            // Initialize WebAssembly
            initWasm();
        });

        // Load WebAssembly module
        async function initWasm() {
            try {
                const { default: init, run_alescript } = await import('./pkg/alescript.js');
                await init('./pkg/alescript_bg.wasm?v=' + Date.now());
                wasmModule = { run_alescript };
                document.getElementById('output').innerHTML = '<span class="success">✓ Ready! Enter your code and press Run or Ctrl+Enter.</span>';
                document.getElementById('status').innerHTML = '✓ Ready';
            } catch (error) {
                document.getElementById('output').innerHTML = `<span class="error">Error loading WebAssembly module:\n${error.message}\n\nMake sure to build the project first with:\nwasm-pack build --target web --out-dir web/pkg</span>`;
                document.getElementById('status').innerHTML = '✗ Error loading WebAssembly';
            }
        }

        // Run code
        function runCode() {
            if (!wasmModule) {
                document.getElementById('output').innerHTML = '<span class="error">WebAssembly module not loaded yet. Please wait...</span>';
                return;
            }

            if (!editor) {
                document.getElementById('output').innerHTML = '<span class="error">Editor not initialized yet. Please wait...</span>';
                return;
            }

            const code = editor.getValue();
            const outputDiv = document.getElementById('output');

            outputDiv.innerHTML = '<span class="loading">Running...</span>';
            document.getElementById('status').innerHTML = '⏳ Running...';

            // Use setTimeout to allow UI to update
            setTimeout(() => {
                try {
                    const result = wasmModule.run_alescript(code);
                    outputDiv.textContent = result || '(no output)';
                    outputDiv.className = '';
                    document.getElementById('status').innerHTML = '✓ Execution completed';
                } catch (error) {
                    outputDiv.innerHTML = `<span class="error">Error:\n${error.message}</span>`;
                    document.getElementById('status').innerHTML = '✗ Execution failed';
                }
            }, 10);
        }

        // Event listeners
        document.getElementById('runButton').addEventListener('click', runCode);

        document.getElementById('examples').addEventListener('change', (e) => {
            const example = e.target.value;
            if (example && examples[example] && editor) {
                editor.setValue(examples[example]);
            }
        });
    </script>
</body>
</html>
